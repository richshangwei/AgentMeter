<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>AgentMeter</title>
  <link rel="icon" type="image/png" href="/assets/agentmeter-icon.png">
  <style>
    :root{font-family:"Segoe UI Variable","Segoe UI","Microsoft JhengHei",system-ui,sans-serif;color:#f6fbff;background:#020d19;--cyan:#35dcff;--mint:#46f3c2;--muted:#91b9d4;--panel:rgba(6,31,54,.83)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{position:relative;background:radial-gradient(circle at 12% 3%,rgba(20,137,222,.38),transparent 34%),radial-gradient(circle at 95% 92%,rgba(15,210,224,.2),transparent 32%),linear-gradient(145deg,#04213d,#020d19 58%,#052139)}body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(125deg,rgba(44,142,225,.08),transparent 42%,rgba(37,225,226,.08))}
    button,input{font:inherit}button{min-width:44px;min-height:44px;border:1px solid rgba(78,207,255,.65);border-radius:999px;background:linear-gradient(180deg,#159ce9,#0870cf);color:#fff;padding:0 15px;font-weight:750;cursor:pointer;touch-action:manipulation;box-shadow:inset 0 1px rgba(255,255,255,.22),0 0 16px rgba(38,193,255,.14)}button:active{transform:translateY(1px);filter:brightness(.92)}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--mint);outline-offset:2px}.secondary,.toolbar button,.close{background:rgba(4,29,51,.76)}
    .shell{position:relative;z-index:1;height:100dvh;overflow:hidden;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px}.topbar{display:flex;align-items:center;gap:12px;min-width:0;min-height:54px}.brand{display:flex;align-items:center;gap:9px;white-space:nowrap}.brand img{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(70,243,194,.18))}.brand strong{font-size:clamp(22px,4.1vw,34px);letter-spacing:-.06em}.brand strong span{color:#1dd9c0}.brand small{padding-left:12px;border-left:1px solid rgba(140,218,255,.48);color:#9fc8e7;font-size:12px;letter-spacing:.05em}.connection{display:flex;align-items:center;gap:7px;margin-left:auto;color:#b4d2e5;font-size:12px;white-space:nowrap}.connection::before{content:"";width:9px;height:9px;border-radius:50%;background:#f1a72d;box-shadow:0 0 9px currentColor}.connection.online::before{background:var(--mint);box-shadow:0 0 12px var(--mint)}.toolbar{display:flex;gap:7px}
    .pairing{width:min(560px,100%);align-self:center;justify-self:center;border:1px solid rgba(82,209,255,.62);border-radius:25px;background:linear-gradient(145deg,rgba(23,76,116,.82),rgba(4,25,44,.94));padding:clamp(22px,4vw,36px);box-shadow:inset 0 1px rgba(255,255,255,.08),0 24px 75px rgba(0,0,0,.54),0 0 32px rgba(31,201,255,.15);backdrop-filter:blur(18px)}.pair-brand{display:block;width:84px;height:84px;margin:0 auto 16px;filter:drop-shadow(0 0 16px rgba(70,243,194,.2))}.pairing h1{margin:0 0 8px;text-align:center;font-size:28px}.pairing p{color:var(--muted);line-height:1.5;text-align:center}.pair-row{display:grid;grid-template-columns:1fr auto;gap:8px}.pair-row input{min-width:0;height:54px;border:1px solid rgba(99,194,239,.56);border-radius:14px;padding:0 14px;background:rgba(1,14,26,.72);color:#fff;font-size:21px;letter-spacing:.16em}
    .dashboard{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px}.meta{display:flex;justify-content:space-between;color:#8cb4cf;font-size:11px;padding:0 3px}.grid{min-height:0;display:grid;grid-template-columns:repeat(var(--grid-columns,3),minmax(0,1fr));grid-template-rows:repeat(var(--grid-rows,2),minmax(0,1fr));gap:clamp(8px,1.5vw,15px)}
    .card{--accent:#35dcff;--accent-soft:rgba(53,220,255,.5);position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;border:1px solid var(--accent);border-radius:clamp(16px,2.4vw,24px);padding:clamp(10px,1.8vh,18px);background:linear-gradient(145deg,rgba(37,116,176,.17),transparent 48%),var(--panel);box-shadow:inset 0 0 30px rgba(42,193,255,.05),0 14px 34px rgba(0,0,0,.3),0 0 18px var(--accent-soft);backdrop-filter:blur(18px) saturate(130%)}.card::after{content:"";position:absolute;inset:auto -18% -55% 20%;height:76%;border-radius:50%;background:radial-gradient(ellipse,var(--accent-soft),transparent 67%);opacity:.25;pointer-events:none}.card-head{position:relative;z-index:1;display:flex;align-items:center;gap:9px;min-width:0;padding-bottom:8px;border-bottom:1px solid rgba(102,193,234,.18)}.provider-badge{display:grid;place-items:center;flex:0 0 auto;width:clamp(35px,5.1vw,50px);height:clamp(35px,5.1vw,50px);border-radius:13px;background:var(--accent);color:#041422;font-weight:900;font-size:18px;object-fit:cover;filter:drop-shadow(0 0 9px var(--accent-soft))}.card h2{min-width:0;margin:0 auto 0 0;font-size:clamp(14px,2.2vw,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.025em}.chip{flex:0 0 auto;border:1px solid currentColor;border-radius:999px;padding:5px 9px;background:rgba(11,72,68,.38);color:var(--mint);font-size:10px;font-weight:750}.chip::before{content:"";display:inline-block;width:6px;height:6px;margin-right:5px;border-radius:50%;background:currentColor;box-shadow:0 0 7px currentColor}.chip.error{background:rgba(104,24,48,.34);color:#ff92ad}.chip.stale{background:rgba(112,77,20,.35);color:#ffd078}
    .metrics{position:relative;z-index:1;display:grid;align-content:center;gap:6px;min-height:0;flex:1;margin:4px 0}.metric{position:relative;display:grid;grid-template-columns:minmax(82px,38%) minmax(0,1fr);grid-template-rows:1fr auto;align-items:center;gap:4px 10px;min-width:0;min-height:clamp(80px,13vh,116px)}.metric:first-child::before{content:"";grid-column:1;grid-row:1/-1;place-self:center;width:min(100%,112px);aspect-ratio:1;border-radius:50%;background:conic-gradient(from -90deg,var(--accent) calc(var(--remaining,0)*1%),rgba(91,137,170,.27) 0);-webkit-mask:radial-gradient(farthest-side,transparent 69%,#000 71%);mask:radial-gradient(farthest-side,transparent 69%,#000 71%);filter:drop-shadow(0 0 8px var(--accent-soft))}.metric-label{grid-column:2;align-self:end;color:#b8d8ec;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.metric-value{grid-column:1;grid-row:1/-1;place-self:center;z-index:2;font-size:clamp(27px,6vh,51px);line-height:.95;color:#fff;font-weight:900;letter-spacing:-.065em;font-variant-numeric:tabular-nums}.track{grid-column:2;height:6px;border-radius:99px;background:rgba(97,142,174,.28);overflow:hidden}.fill{height:100%;border-radius:inherit;background:var(--accent);box-shadow:0 0 9px var(--accent)}.secondary-metric{min-height:34px;grid-template-columns:1fr auto;grid-template-rows:auto 5px;padding:7px 9px;border:1px solid rgba(111,193,236,.2);border-radius:11px;background:rgba(6,31,52,.65)}.secondary-metric::before{display:none!important}.secondary-metric .metric-label,.secondary-metric .metric-value,.secondary-metric .track{grid-column:auto;grid-row:auto;place-self:auto}.secondary-metric .metric-value{font-size:18px}.secondary-metric .track{grid-column:1/-1}.unknown{display:grid;place-items:center;align-content:center;gap:2px;margin:auto;font-size:clamp(17px,3vw,25px);font-weight:800;color:#87abc2;text-align:center}.unknown img{width:clamp(58px,10vh,88px);height:clamp(58px,10vh,88px);object-fit:contain;filter:drop-shadow(0 0 14px rgba(78,194,255,.3))}.unknown strong{color:#f1fbff}.unknown span{font-size:10px;font-weight:500}.card-foot{position:relative;z-index:1;color:#82a8c1;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-actions{position:relative;z-index:1;display:flex;gap:7px;margin-top:7px}.card-actions button{flex:1}.dashboard-empty{grid-column:1/-1;display:grid;place-content:center;justify-items:center;gap:8px;border:1px dashed rgba(93,215,255,.48);border-radius:20px;background:rgba(5,29,49,.6);color:var(--muted);text-align:center}.dashboard-empty strong{color:#f2fbff;font-size:clamp(20px,4vw,30px)}
    .pager{display:flex;align-items:center;justify-content:center;gap:9px;min-height:32px}.pager button{min-height:36px;padding:0 12px;font-size:11px}.pager span{font-size:11px;color:var(--muted)}dialog{width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;border:1px solid rgba(82,209,255,.62);border-radius:22px;background:linear-gradient(145deg,rgba(20,68,105,.96),rgba(3,20,36,.99));color:#f5fbff;padding:clamp(15px,3vw,24px);box-shadow:0 25px 80px rgba(0,0,0,.7),0 0 30px rgba(31,201,255,.15)}dialog::backdrop{background:rgba(0,7,16,.82);backdrop-filter:blur(7px)}.dialog-head{display:flex;align-items:center;gap:10px}.dialog-head h2{margin:0 auto 0 0}.close{padding:0}.monitor-option{display:flex;align-items:center;gap:10px;min-height:58px;padding:7px 0;border-bottom:1px solid rgba(114,183,219,.22)}.monitor-option input{width:21px;height:21px;accent-color:var(--mint)}.monitor-option-info{display:grid;gap:2px;min-width:0;margin-right:auto}.monitor-option-info small{color:var(--muted);font-size:10px}.monitor-order{display:flex;gap:5px}.monitor-order button{min-height:44px;padding:0 10px;font-size:10px}.catalog-dot{width:20px;height:20px;border:1px dashed #7296ad;border-radius:50%}.catalog-badge{padding:5px 8px;border:1px solid #6f91a8;border-radius:999px;color:#9db6c6;font-size:9px}.guide-steps{counter-reset:step;list-style:none;padding:0;display:grid;gap:9px}.guide-steps li{counter-increment:step;display:grid;grid-template-columns:30px 1fr;gap:9px;align-items:start;color:#c2dcec;font-size:12px;line-height:1.4}.guide-steps li::before{content:counter(step);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:rgba(22,124,178,.5);color:#7bedff;font-weight:800}.official-link{display:inline-flex;align-items:center;min-height:44px;border-radius:999px;padding:0 14px;background:linear-gradient(180deg,#159ce9,#0870cf);color:#fff;text-decoration:none;font-weight:800}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}[hidden]{display:none!important}
    @media(min-width:900px) and (min-height:700px){.grid[data-density="comfortable"] .metric:first-child{grid-template-columns:minmax(125px,40%) minmax(0,1fr);min-height:145px}.grid[data-density="comfortable"] .metric:first-child::before{width:min(100%,145px)}.grid[data-density="comfortable"] .metric:first-child .metric-value{font-size:52px}}
    @media(max-height:600px){.shell{padding-block:7px;gap:5px}.topbar{min-height:44px}.brand img{width:34px;height:34px}.brand strong{font-size:20px}.brand small,.connection,.meta{display:none}.card{padding:8px;border-radius:14px}.provider-badge{width:32px;height:32px}.metric{min-height:70px}.secondary-metric,.card-foot{display:none}.metric-value{font-size:34px}.card-actions{margin-top:4px}.pager{min-height:28px}.pager button{min-height:32px}.grid[data-count="3"] .card{display:grid;grid-template-rows:44px minmax(0,1fr);padding:4px 7px}.grid[data-count="3"] .card-head{min-height:44px;padding:0 96px 0 0;border:0}.grid[data-count="3"] .provider-badge{width:28px;height:28px;border-radius:8px}.grid[data-count="3"] .chip{display:none}.grid[data-count="3"] .metrics{grid-row:2;margin:0}.grid[data-count="3"] .metric{min-height:40px}.grid[data-count="3"] .card-actions{position:absolute;z-index:3;top:4px;right:7px;width:82px;margin:0}.grid[data-count="3"] .card-actions button{min-height:44px;padding:0 6px}.grid[data-count="3"] .card-actions button:first-child:not(:last-child){display:none}}
    @media(max-width:520px){.shell{padding-inline:7px}.brand img{width:34px;height:34px}.brand strong{font-size:20px}.brand small,.connection{display:none}.toolbar button{padding:0 9px;font-size:11px}.card h2{font-size:13px}.chip{padding:4px 6px}.provider-badge{width:31px;height:31px;border-radius:10px}.secondary-metric{display:none}.metric-value{font-size:clamp(22px,8.5vw,30px);letter-spacing:-.045em}.card-actions button{min-height:40px;padding:0 6px;font-size:11px}.unknown{font-size:16px}.metric{grid-template-columns:minmax(70px,42%) minmax(0,1fr)}}
    @media(max-height:800px){.grid[data-count="4"] .card-foot{display:none}}
    @media(max-height:600px){.grid[data-count="3"] .unknown{display:flex;align-items:center;justify-content:center;gap:7px}.grid[data-count="3"] .unknown img{width:38px;height:38px}.grid[data-count="3"] .unknown span{display:none}}
    @media(prefers-reduced-motion:no-preference){button,.card{transition:filter .18s,transform .18s,border-color .18s}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><img src="/assets/agentmeter-icon.png" alt=""><strong>Agent<span>Meter</span></strong><small>AI 代理監控</small></div><div id="connection" class="connection"><span id="status" role="status">尚未配對</span></div><nav class="toolbar" aria-label="畫面控制"><button id="fullscreen" type="button">全螢幕</button><button id="settings" type="button">設定</button></nav></header>
    <section id="pairing" class="pairing"><img class="pair-brand" src="/assets/agentmeter-icon.png" alt=""><h1>連接 AgentMeter</h1><p>輸入桌機顯示的 8 位配對碼，即時查看所有 AI 工具額度。</p><label for="code" class="sr-only">8 位配對碼</label><div class="pair-row"><input id="code" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••••••"><button id="pair">安全配對</button></div><p id="recovery-status">可在相同瀏覽器與網址自動恢復配對。</p></section>
    <section id="dashboard" class="dashboard" hidden><div class="meta"><span id="revision">等待資料</span><span id="last-sync">尚未同步</span></div><section id="cards" class="grid" aria-label="監控資料"></section><nav id="pager" class="pager" aria-label="監控分頁" hidden><button id="previous-page">上一頁</button><span id="page-indicator">1 / 1</span><button id="next-page">下一頁</button></nav></section>
  </main>
  <dialog id="settings-dialog"><div class="dialog-head"><h2>AI Agent 監控</h2><button class="close" data-close="settings-dialog" aria-label="關閉設定">×</button></div><p>在這裡逐一加入、移除或調整顯示順序；每頁最多四張卡片。</p><div id="monitor-options"></div><p id="monitor-count" role="status"></p></dialog>
  <dialog id="guide-dialog"><div class="dialog-head"><h2 id="guide-title">安裝步驟</h2><button class="close" data-close="guide-dialog" aria-label="關閉教學">×</button></div><ol id="guide-steps" class="guide-steps"></ol><a id="guide-link" class="official-link" target="_blank" rel="noopener noreferrer">開啟官方安裝說明</a></dialog>
  <script src="protocol.js"></script><script src="recovery.js"></script><script src="view.js"></script><script src="client.js"></script>
</body>
</html>
