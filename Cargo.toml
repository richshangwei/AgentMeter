[package]
name = "agentmeter-p0"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
getrandom = "=0.3.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.60.2", features = ["Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }
